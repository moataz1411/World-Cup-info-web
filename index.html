<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup Info-Web</title>
    <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="backcircle1"></div>
        <div class="backcircle2"></div>
        <div class="container">
            <h3 class="subtit">
                Countdown to the..
            </h3>
            <h1 class="title">
                FIFA World Cup 
                <span>2026</span>
            </h1>
        <div class="line"></div>
        <div class="coudown">
            <div class="card">
                <h2 id="days">00</h2>
                <p>Days</p>
                </div>
                <div class="card">
                    <h2 id="hours">00</h2>
                    <p>Hours</p>
                    </div>
                <div class="card">
                    <h2 id="minutes">00</h2>
                    <p>Minutes</p>
                    </div>
                    <div class="card active">
                        <h2 id="second">00</h2>
                        <p>Seconds</p>
                        </div>
                </div>
            </div>
            <footer>
                FIFA World Cup 2026 
                </footer>
                <script src="script.js"></script>
                </body>
