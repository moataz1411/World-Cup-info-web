<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup Info-Web</title>
    <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="backcircle1"></div>
        <div class="backcircle2"></div>
        <div class="container">
            <h3 class="subtit">
                Countdown to the..
            </h3>
            <h1 class="title">
                FIFA World Cup 
                <span>2026</span>
            </h1>
        <div class="line"></div>
        <div class="coudown">
            <div class="card">
                <h2 id="days">00</h2>
                <p>Days</p>
                </div>
                <div class="card">
                    <h2 id="hours">00</h2>
                    <p>Hours</p>
                    </div>
                <div class="card">
                    <h2 id="minutes">00</h2>
                    <p>Minutes</p>
                    </div>
                    <div class="card active">
                        <h2 id="seconds">00</h2>
                        <p>Seconds</p>
                        </div>
                </div>
            </div>
        <section class="countries-section">
            <h2 class="section-title">Participating countries </h2>
            <div class="countries-area">
                <div class="country-card" data-country="argentina">
                    <img src="flags/argentina.png">
                    <h3>Argentina</h3>
                    </div>
                    <div class="country-card" data-country="france">
                        <img src="flags/france.png">
                        <h3>France</h3>
                    </div>
                    <div class="country-card" data-country="england">
                        <img src="flags/england.png">
                        <h3>England</h3>
                    </div>
                    <div class="country-card" data-country="croatia">
                        <img src="flags/croatia.png">
                        <h3>Croatia</h3>
                    </div>  
                    <div class="country-card" data-country="morocco">
                        <img src="flags/morocco.png">
                        <h3>Morocco</h3>  
                    </div>
                    <div class="country-card" data-country="usa">
                        <img src="flags/usa.png">
                        <h3>USA</h3>
                    </div>
                    <div class="country-card" data-country="spain">
                        <img src="flags/spain.png">
                        <h3>Spain</h3>
                    </div>
                    <div class="country-card" data-country="portugal">
                        <img src="flags/porugal.png">
                        <h3>Portugal</h3>
                    </div>
                    <div class="country-card" data-country="brazil">
                        <img src="flags/brazil.png">
                        <h3>Brazil</h3>
                    </div>
                    <div class="country-card" data-country="germany">
                        <img src="flags/germany.png">
                        <h3>Germany</h3>
                    </div>   
                    <div class="country-card" data-country="egypt">
                        <img src="flags/egypt.png">
                        <h3>Egypt</h3>
                    </div>
                    <div class="country-card" data-country="netherlands">
                        <img src="flags/netherlands.png">
                        <h3>Netherlands</h3>
                    </div>
                </div>
                </section>
                <section class="team-details">
                    <div class="team-header">
                        <img src="flags/argentina.png" id="selectedFlag" class="selected-flag">
                    <div>
                        <h2 id="countryName">Argentina</h2>
                        <p>Starting XI</p>
                    </div>
                </div>
                 <div class="players-grid" id="playersGrid"></div>
                 </section>
            <footer>
                FIFA World Cup 2026 
                </footer>
                <script src="script.js"></script>
                </body>
                </html>
